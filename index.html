<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<meta name="description" content="MOFU TSUM POP - もふもふツムを つなげて消す パズルゲーム / A fluffy match puzzle game">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOFU TSUM POP｜もふもふツムポップ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='9.5' cy='9' r='4.6' fill='%23e0658e'/><circle cx='22.5' cy='9' r='4.6' fill='%23e0658e'/><circle cx='16' cy='18' r='11.5' fill='%23ff92b8'/><circle cx='12.3' cy='17' r='1.7' fill='%23453a52'/><circle cx='19.7' cy='17' r='1.7' fill='%23453a52'/><path d='M13.4 21.5q2.6 2.4 5.2 0' stroke='%23453a52' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>">

<!-- デザイン用ライブラリ: Google Fonts (読み込み失敗時はシステムフォントに自動フォールバック) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-lang="ja" class="booting">

<div id="app" class="app">

  <!-- 背景デコ（CSSアニメ） -->
  <div class="bg-deco" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <span class="blob b4"></span><span class="blob b5"></span><span class="blob b6"></span>
  </div>

  <!-- ============ タイトル ============ -->
  <section class="screen show" id="screen-title">
    <div class="title-top">
      <div class="lang-switch" id="lang-title" role="group" aria-label="Language"></div>
      <button class="icon-btn" id="btn-title-sound" type="button" aria-pressed="true">
        <span class="ic" data-ic="sound-on"></span>
      </button>
    </div>

    <div class="title-stage">
      <div class="logo">
        <h1 class="logo-jp">もふもふツムポップ</h1>
        <p class="logo-en">MOFU&nbsp;TSUM&nbsp;POP</p>
      </div>
      <div class="title-parade"><canvas id="title-canvas" width="360" height="140"></canvas></div>
      <p class="tagline" data-i18n="app.tagline"></p>
    </div>

    <div class="title-menu">
      <button class="btn primary big" id="btn-play" type="button"><span data-i18n="btn.play"></span></button>
      <div class="menu-row">
        <button class="btn soft" id="btn-levels" type="button"><span data-i18n="btn.levels"></span></button>
        <button class="btn soft" id="btn-help" type="button"><span data-i18n="btn.howto"></span></button>
      </div>
      <button class="btn ghost" id="btn-settings" type="button"><span data-i18n="btn.settings"></span></button>
      <div class="title-stats" id="title-stats"></div>
    </div>
    <p class="credit" data-i18n="app.credit"></p>
  </section>

  <!-- ============ レベル選択 ============ -->
  <section class="screen" id="screen-levels">
    <header class="bar">
      <button class="icon-btn" id="btn-levels-back" type="button"><span class="ic" data-ic="back"></span></button>
      <h2 data-i18n="levels.title"></h2>
      <div class="coin-chip" id="coin-levels"><span class="ic coin"></span><b>0</b></div>
    </header>
    <div class="levels-scroll">
      <div class="levels-grid" id="levels-grid"></div>
      <p class="levels-note" data-i18n="levels.note"></p>
    </div>
  </section>

  <!-- ============ ゲーム ============ -->
  <section class="screen" id="screen-game">
    <header class="hud">
      <div class="hud-row">
        <div class="hud-level"><b id="hud-level">1</b><small data-i18n="game.level"></small></div>
        <div class="hud-score">
          <div class="score-num" id="hud-score">0</div>
          <div class="hud-target"><span data-i18n="game.target"></span> <b id="hud-target">0</b></div>
        </div>
        <button class="icon-btn small" id="btn-pause" type="button"><span class="ic" data-ic="pause"></span></button>
      </div>
      <div class="timebar"><div class="timebar-fill" id="timebar"></div><span class="time-num" id="hud-time">60</span></div>
      <div class="hud-row gauges">
        <div class="gauge fever">
          <div class="gauge-head"><span data-i18n="game.fever"></span><b id="hud-fever-pct">0%</b></div>
          <div class="gauge-bar"><div class="gauge-fill" id="gauge-fever"></div></div>
        </div>
        <div class="combo-pill" id="combo-pill"><span data-i18n="game.combo"></span> <b id="hud-combo">0</b></div>
        <div class="gauge skill">
          <div class="gauge-head"><span data-i18n="game.skill"></span><b id="hud-skill-pct">0%</b></div>
          <div class="gauge-bar"><div class="gauge-fill" id="gauge-skill"></div></div>
        </div>
      </div>
      <div class="mission-line" id="hud-mission"></div>
    </header>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board"></canvas>
      <div class="board-msg" id="board-msg"></div>
      <div class="fever-flash" id="fever-flash"></div>
    </div>

    <footer class="toolbar">
      <div class="tb-left">
        <div class="chain-readout" id="chain-readout"><small data-i18n="game.chain"></small><b id="hud-chain">0</b></div>
      </div>
      <button class="skill-btn" id="btn-skill" type="button" disabled>
        <span class="skill-ic"></span>
        <span class="skill-label" data-i18n="game.skill"></span>
      </button>
      <div class="tb-right">
        <div class="coin-chip small"><span class="ic coin"></span><b id="hud-coins">0</b></div>
      </div>
    </footer>
  </section>

  <!-- ============ 汎用ダイアログ ============ -->
  <div class="dialog-root" id="dialog-root" hidden>
    <div class="dialog-card" id="dialog-card" role="dialog" aria-modal="true"></div>
  </div>

</div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/art.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
